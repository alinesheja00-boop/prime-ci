<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Circle - P2P Gifting</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-zinc-900 border border-amber-500/30 p-6 rounded-2xl shadow-2xl text-center space-y-6">
        <h1 class="text-3xl font-extrabold text-amber-400">PRIME CIRCLE</h1>
        <p class="text-xs text-zinc-400 uppercase tracking-widest">P2P Gifting & Matrix System</p>
        
        <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-2">
            <span class="text-xs font-bold text-amber-500">LEVEL 2 (SILVER)</span>
            <div class="text-2xl font-extrabold text-emerald-400">8 / 8 Seats Paid</div>
            <p class="text-[11px] text-zinc-400">Matrix Auto-Rotation Ready</p>
        </div>

        <button onclick="handleGraduate()" class="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-700 text-zinc-950 font-bold py-3 rounded-xl shadow-lg hover:opacity-90 transition cursor-pointer">
            Receiver Confirm & Graduate 🚀
        </button>
    </div>

    <script>
        function handleGraduate() {
            alert('🎉 Congratulations! 8/8 Completed. Successfully auto-rotated to the next level!');
        }
    </script>
</body>
</html>
